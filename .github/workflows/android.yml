name: Android CI

# Builds, tests and (on a version tag) releases the locked-down arena.ai WebView wrapper.
#
# Jobs
#   unit-tests          - the security core on the JVM: URL policy, allow-list, back navigation,
#                         manifest/network-config and source invariants. Fast and blocking.
#   build-apk           - debug + release APKs, plus a verification pass over the *shipped* APK
#                         (badging: package name, permissions, not debuggable, minSdk).
#   instrumented-tests  - the same guards on a real Android emulator with a real WebView.
#                         Not a dependency of the release job, so emulator flakiness can never block
#                         a build - but it is reported honestly (red means red).
#   release             - attaches the APK and its checksum to a GitHub Release when a v* tag is pushed.

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the committed Gradle wrapper jar
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum -c gradle/wrapper/gradle-wrapper.jar.sha256

      - name: Validate the wrapper against Gradle's known-good checksums
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 30

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install a custom signing key (optional)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "No SIGNING_KEYSTORE_BASE64 secret: the committed demo key will be used."
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/release-signing.p12
          echo "SIGNING_KEYSTORE_PATH=/tmp/release-signing.p12" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_TYPE=PKCS12" >> "$GITHUB_ENV"
          echo "Installed the custom signing key."

      - name: Build debug and release APKs
        env:
          # Optional: point at your own release key. Without these the committed demo key is used.
          SIGNING_KEYSTORE_PATH: ${{ secrets.SIGNING_KEYSTORE_PATH }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify the release APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          echo "APK: $APK"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)"
          "$AAPT2" dump badging "$APK" > apk-badging.txt
          cat apk-badging.txt

          fail=0
          check() { # name, pattern, expect_present(1/0)
            if grep -qE "$2" apk-badging.txt; then found=1; else found=0; fi
            if [ "$found" -ne "$3" ]; then echo "FAILED: $1"; fail=1; else echo "ok: $1"; fi
          }

          check "package id"                "package: name='app.arenawebview.locked'" 1
          check "has a version name"        "versionName='" 1
          check "INTERNET permission"       "uses-permission: name='android.permission.INTERNET'" 1
          check "no CAMERA permission"      "uses-permission: name='android.permission.CAMERA'" 0
          check "no location permission"    "uses-permission: name='android.permission.ACCESS_FINE_LOCATION'" 0
          check "no storage permission"     "uses-permission: name='android.permission.WRITE_EXTERNAL_STORAGE'" 0
          check "no READ_CONTACTS"          "uses-permission: name='android.permission.READ_CONTACTS'" 0
          check "not debuggable"            "application-debuggable" 0
          check "launcher entry present"    "launchable-activity: name='app.arenawebview.locked.MainActivity'" 1
          check "one launcher entry only"   "launchable-activity:" 1

          echo "--- badging summary ---"
          grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity|uses-permission" apk-badging.txt || true
          exit $fail

      - name: Checksums
        run: |
          set -euo pipefail
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            sha256sum "$apk" | tee -a APK-SHA256SUMS.txt
          done
          cat APK-SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: arena-webview-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            APK-SHA256SUMS.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 90

  instrumented-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the guards on a real WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -x
            mkdir -p docs/evidence
            adb logcat -c || true
            ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace || echo "instrumented tests reported failures" > /tmp/instrumented-failed
            adb logcat -d -s ArenaWebViewLocked:V > docs/evidence/device-logcat.txt || true
            # Screenshot of the app as evidence of what it renders in this environment. The connected
            # task uninstalls the APKs when it finishes, so install the debug build again first.
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk || true
            adb shell am start -n app.arenawebview.locked/app.arenawebview.locked.MainActivity || true
            sleep 25
            adb logcat -d -s ArenaWebViewLocked:V > docs/evidence/device-logcat.txt || true
            adb exec-out screencap -p > docs/evidence/app-screenshot.png || true
            adb shell dumpsys activity activities > docs/evidence/device-activities.txt || true
            ls -la docs/evidence || true
            test ! -f /tmp/instrumented-failed

      - name: Publish instrumented test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-evidence
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/**
            docs/evidence/**
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the built APKs
        uses: actions/download-artifact@v4
        with:
          name: arena-webview-apk
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -laR dist
          mapfile -t FILES < <(find dist -type f \
            \( -name '*.apk' -o -name 'APK-SHA256SUMS.txt' -o -name 'apk-badging.txt' \))
          printf 'attaching: %s\n' "${FILES[@]}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Arena WebView (Locked) ${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE_NOTES.md \
            "${FILES[@]}" 
