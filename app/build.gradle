plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------------------------
// Signing
//
// Release builds are signed with the demo keystore that is committed to this repository so that every
// CI run produces an APK that can upgrade the previous one. For anything real, override it with your
// own key through environment variables / GitHub secrets (see README):
//
//   SIGNING_KEYSTORE_PATH, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD,
//   SIGNING_STORE_TYPE
// ---------------------------------------------------------------------------------------------
def signingKeystorePath = System.getenv('SIGNING_KEYSTORE_PATH') ?: 'keystore/arena-webview-demo.p12'
def signingStorePassword = System.getenv('SIGNING_STORE_PASSWORD') ?: 'arenawebview'
def signingKeyAlias = System.getenv('SIGNING_KEY_ALIAS') ?: 'arenawebview'
def signingKeyPassword = System.getenv('SIGNING_KEY_PASSWORD') ?: 'arenawebview'
def signingStoreType = System.getenv('SIGNING_STORE_TYPE') ?: 'PKCS12'

android {
    namespace 'app.arenawebview.locked'
    compileSdk 35

    defaultConfig {
        applicationId 'app.arenawebview.locked'
        // WebView is updated through the Play Store independently of the OS, so a low minSdk still gets
        // a modern Chromium. 24 (Android 7.0) keeps the app usable on old hardware.
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            // resolved against the repository root, so the same path works from any module
            storeFile rootProject.file(signingKeystorePath)
            storePassword signingStorePassword
            keyAlias signingKeyAlias
            keyPassword signingKeyPassword
            storeType signingStoreType
        }
    }

    buildTypes {
        release {
            // Deliberately not minified/obfuscated: this project's value is that its security
            // behaviour is auditable, and there is no third-party code to strip.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            // Same applicationId, so an installed debug build is replaced by the release APK instead of
            // living next to it.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        // Lint findings are reported but never block a security build; the security invariants are
        // enforced by the unit tests in app/src/test and the instrumented tests in app/src/androidTest.
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
}

dependencies {
    // The policy layer is pure Java and is verified with plain JUnit on the JVM.
    testImplementation 'junit:junit:4.13.2'

    // On-device verification of the real WebView behaviour.
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
